services:
  mal-cover-lint:
    container_name: mal-cover-lint
    image: golangci/golangci-lint:v2.15.0
    working_dir: /mal-cover
    command: make lint
    environment:
      - GOFLAGS=-mod=vendor
    volumes:
      - ../:/mal-cover:ro
      - go-mod-cache:/go/pkg/mod
    profiles:
      - lint

volumes:
  go-mod-cache:
